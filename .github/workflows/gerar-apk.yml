name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Abrir o projeto
        run: |
          mkdir -p build-src
          tar xzf projeto.tar.gz -C build-src

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        working-directory: build-src
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp build-src/app/build/outputs/apk/release/app-release.apk GotaAGota.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GotaAGota-APK
          path: GotaAGota.apk

      - name: Publicar versao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Gota a Gota v1.${{ github.run_number }}
          files: GotaAGota.apk
